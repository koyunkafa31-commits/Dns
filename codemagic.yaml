workflows:
  android-workflow:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Build Android APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk